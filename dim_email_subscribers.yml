module:
  identifier: "dim_email_subscribers"
  schema: "dbt_prd"
  table: "dim_email_subscribers"
  label: "Email Subscribers"
  description: "One row per known subscriber, with current subscription state and lifecycle timestamps. Email addresses are intentionally excluded from Steep."
  dimensions:
    - column: "min_subscribed_ts"
      type: "time"
      label: "First Subscribed At"
      description: "Earliest known subscription timestamp, used to group subscriber acquisition cohorts."
  joinPaths:
    - from:
        column: "subscriber_id"
      to:
        table: "fct_email_events"
        column: "subscriber_id"
      type: "one-to-many"
    - from:
        column: "subscriber_id"
      to:
        table: "fct_email_subscriber_messages"
        column: "subscriber_id"
      type: "one-to-many"
    - from:
        column: "subscriber_id"
      to:
        table: "fct_email_subscribers_daily"
        column: "subscriber_id"
      type: "one-to-many"
    - from:
        column: "subscriber_id"
      to:
        table: "fct_form_submissions"
        column: "subscriber_id"
      type: "one-to-many"
  entities:
    - identifier: "email_subscriber"
      name: "Email Subscriber"
      icon_name: "user"
      primary_key: "subscriber_id"
      properties:
        - column: "is_subscribed"
          name: "Is currently subscribed"
          type: "boolean"
        - column: "min_subscribed_ts"
          name: "First subscribed at"
          type: "time"
        - column: "max_subscribed_ts"
          name: "Most recently subscribed at"
          type: "time"
        - column: "max_unsubscribed_ts"
          name: "Most recently unsubscribed at"
          type: "time"
      metrics:
        - "engaged_email_subscribers"
        - "email_subscriber_messages_opened"
        - "email_subscriber_messages_clicked"
        - "form_submissions"
