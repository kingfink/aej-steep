# yaml-language-server: $schema=https://api.steep.app/v1/code/schema/module
module:
  identifier: "fct_events"
  schema: "marts"
  table: "fct_events"
  label: "Events"
  description: "GA4 Events"
  dimensions:
    - column: "event_name"
      type: "categorical"
      description: ""
      label: "Event Name"
  metrics:
    - identifier: "count_events"
      name: "# of Events"
      time: "fct_events.event_date"
      description: "Count of events"
      calculation: "count"
      dimensions:
        - "event_name"
