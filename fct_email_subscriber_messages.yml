module:
  identifier: "fct_email_subscriber_messages"
  schema: "marts"
  table: "fct_email_subscriber_messages"
  label: "Email Subscriber Messages"
  description: "One row per email message and known subscriber, with delivery and engagement outcomes aggregated from provider events."
  metrics:
    - identifier: "email_subscriber_messages"
      name: "Email subscriber messages"
      description: "Number of messages sent to known subscribers, attributed to the earliest sent-event timestamp."
      category: "Email"
      type: "count"
      time: "fct_email_subscriber_messages.min_sent_ts"
    - identifier: "email_subscriber_messages_delivered"
      name: "Email subscriber messages delivered"
      description: "Number of subscriber messages with a delivered event."
      category: "Email"
      type: "custom-value"
      time: "fct_email_subscriber_messages.min_sent_ts"
      sql_expression: "countif(fct_email_subscriber_messages.min_delivered_ts is not null)"
    - identifier: "email_subscriber_messages_opened"
      name: "Email subscriber messages opened"
      description: "Number of delivered subscriber messages with at least one open event, including privacy-proxied and bot-like activity."
      category: "Email"
      type: "custom-value"
      time: "fct_email_subscriber_messages.min_sent_ts"
      sql_expression: "countif(fct_email_subscriber_messages.min_delivered_ts is not null and fct_email_subscriber_messages.min_opened_ts is not null)"
    - identifier: "email_subscriber_messages_clicked"
      name: "Email subscriber messages clicked"
      description: "Number of delivered subscriber messages with at least one click event, including privacy-proxied and bot-like activity."
      category: "Email"
      type: "custom-value"
      time: "fct_email_subscriber_messages.min_sent_ts"
      sql_expression: "countif(fct_email_subscriber_messages.min_delivered_ts is not null and fct_email_subscriber_messages.min_clicked_ts is not null)"
    - identifier: "email_delivery_rate"
      name: "Email delivery rate"
      description: "Percentage of subscriber messages with a delivered event."
      category: "Email"
      type: "derived-ratio"
      numerator: "email_subscriber_messages_delivered"
      denominator: "email_subscriber_messages"
      format: "percentage"
    - identifier: "email_open_rate"
      name: "Email open rate"
      description: "Percentage of delivered subscriber messages with at least one open event, including privacy-proxied and bot-like activity."
      category: "Email"
      type: "derived-ratio"
      numerator: "email_subscriber_messages_opened"
      denominator: "email_subscriber_messages_delivered"
      format: "percentage"
    - identifier: "email_click_rate"
      name: "Email click rate"
      description: "Percentage of delivered subscriber messages with at least one click event, including privacy-proxied and bot-like activity."
      category: "Email"
      type: "derived-ratio"
      numerator: "email_subscriber_messages_clicked"
      denominator: "email_subscriber_messages_delivered"
      format: "percentage"
