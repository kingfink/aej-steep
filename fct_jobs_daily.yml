module:
  identifier: "fct_jobs_daily"
  schema: "dbt_prd"
  table: "fct_jobs_daily"
  label: "Daily Jobs"
  description: "One row per UTC date and job listed on the site at any point during the date, from the date the job was added through its removal date, or through the current date while it is active. Inactive jobs with an unknown listing period, such as a missing removal date, have no rows, so history understates listed jobs; current figures are unaffected. Job attributes, including salary, level, role type, and remote status, come from Jobs and reflect current state, so a past date applies current attributes to the jobs listed then. Every metric reports the latest date in the selected range, which is the as-of date. Salary figures are advertised USD base-pay ranges annualized upstream, not offers or employee earnings."
  metrics:
    - identifier: "listed_jobs"
      name: "Listed jobs"
      description: "Number of jobs listed on the latest date in the range. With a range ending today, this is the number of currently active jobs and the denominator of salary coverage."
      category: "Jobs"
      type: "count"
      time: "fct_jobs_daily.date_day"
      time_aggregation: "last-date"
      dimensions:
        - "dbt_prd.dim_jobs.*"
    - identifier: "listed_jobs_with_salary"
      name: "Listed jobs with salary"
      description: "Number of jobs listed on the latest date in the range that have a usable USD salary range, meaning both annual bounds are present. This is also the observation count behind the salary midpoint summaries. It counts usable USD ranges, not disclosure in any currency."
      category: "Jobs"
      type: "custom-value"
      time: "fct_jobs_daily.date_day"
      time_aggregation: "last-date"
      sql_expression: "countif(dim_jobs.salary_annual_min is not null and dim_jobs.salary_annual_max is not null)"
      dimensions:
        - "dbt_prd.dim_jobs.*"
    - identifier: "listed_job_salary_coverage"
      name: "Listed job salary coverage"
      description: "Percentage of jobs listed on the latest date in the range that have a usable USD salary range. Label it as usable USD salary coverage, not disclosure in any currency. Coverage can be shown for groups of any size."
      category: "Jobs"
      type: "derived-ratio"
      numerator: "listed_jobs_with_salary"
      denominator: "listed_jobs"
      format: "percentage"
      dimensions:
        - "dbt_prd.dim_jobs.*"
    - identifier: "salary_midpoint_median"
      name: "Salary midpoint median"
      description: "Approximate median posted-range midpoint, the Jobs salary annual midpoint, across jobs listed on the latest date in the range with a usable USD salary range. Uses BigQuery approx_quantiles for simplicity, since BigQuery has no aggregate percentile_cont; results are close to, but not exactly, the interpolated median. Show it with Listed jobs with salary and the as-of date, because small groups are unstable. Inferred annual periods, broad combined location bands, and the employer, location, and level mix all affect it, and a change between dates does not establish a market-pay trend."
      category: "Jobs"
      type: "custom-value"
      time: "fct_jobs_daily.date_day"
      time_aggregation: "last-date"
      sql_expression: "approx_quantiles(dim_jobs.salary_annual_midpoint, 100)[offset(50)]"
      dimensions:
        - "dbt_prd.dim_jobs.*"
    - identifier: "salary_midpoint_p25"
      name: "Salary midpoint 25th percentile"
      description: "Approximate 25th percentile of posted-range midpoints across jobs listed on the latest date in the range with a usable USD salary range; the lower edge of the middle 50%. Carries the same caveats as Salary midpoint median."
      category: "Jobs"
      type: "custom-value"
      time: "fct_jobs_daily.date_day"
      time_aggregation: "last-date"
      sql_expression: "approx_quantiles(dim_jobs.salary_annual_midpoint, 100)[offset(25)]"
      dimensions:
        - "dbt_prd.dim_jobs.*"
    - identifier: "salary_midpoint_p75"
      name: "Salary midpoint 75th percentile"
      description: "Approximate 75th percentile of posted-range midpoints across jobs listed on the latest date in the range with a usable USD salary range; the upper edge of the middle 50%. Carries the same caveats as Salary midpoint median."
      category: "Jobs"
      type: "custom-value"
      time: "fct_jobs_daily.date_day"
      time_aggregation: "last-date"
      sql_expression: "approx_quantiles(dim_jobs.salary_annual_midpoint, 100)[offset(75)]"
      dimensions:
        - "dbt_prd.dim_jobs.*"
