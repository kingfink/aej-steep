module:
  identifier: "fct_web_sessions"
  schema: "dbt_prd"
  table: "fct_web_sessions"
  label: "Web Sessions Fact"
  description: "One row per captured PostHog session with provisional audience-growth outcome flags. This is a session count, not a unique-person count. No traffic-quality, geography, browser, device, or persistence-mode exclusion is applied."
  metrics:
    - identifier: "engaged_job_seeker_sessions"
      name: "Engaged job-seeker sessions"
      description: "Captured sessions that reached at least one job-detail page while the job was active on the event date. A date range attributes each session to its earliest captured event; this proposed time basis must be approved against counting any qualifying activity in the range. Use a rolling 28-day range for the provisional audience-growth outcome. This metric is not a cross-channel unique-person count."
      category: "Audience growth"
      type: "custom-value"
      time: "fct_web_sessions.session_started_ts"
      sql_expression: "countif(fct_web_sessions.has_active_job_view)"
      dimensions:
        - "dbt_prd.dim_web_sessions.*"
    - identifier: "applying_engaged_job_seeker_sessions"
      name: "Applying engaged job-seeker sessions"
      description: "Captured sessions that reached an active job-detail page and generated at least one outbound apply click."
      category: "Audience growth"
      type: "custom-value"
      time: "fct_web_sessions.session_started_ts"
      sql_expression: "countif(fct_web_sessions.has_active_job_view and fct_web_sessions.has_apply_click)"
      dimensions:
        - "dbt_prd.dim_web_sessions.*"
    - identifier: "engaged_session_apply_rate"
      name: "Engaged session apply rate"
      description: "Percentage of captured engaged job-seeker sessions that generated at least one outbound apply click. This is the provisional quality guardrail and must be interpreted with persistence and traffic-quality coverage."
      category: "Audience growth"
      type: "derived-ratio"
      numerator: "applying_engaged_job_seeker_sessions"
      denominator: "engaged_job_seeker_sessions"
      format: "percentage"
      dimensions:
        - "dbt_prd.dim_web_sessions.*"
