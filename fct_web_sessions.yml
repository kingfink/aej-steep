module:
  identifier: "fct_web_sessions"
  schema: "dbt_prd"
  table: "fct_web_sessions"
  label: "Web Sessions Fact"
  description: "One row per captured PostHog session with provisional audience-growth outcome flags. This is a session count, not a unique-person count. No geography, browser, or device exclusion is applied; landing-only sessions are excluded from engagement by definition."
  metrics:
    - identifier: "engaged_job_seeker_sessions"
      name: "Engaged job-seeker sessions"
      description: "Captured sessions that reached a job-detail page while the job was active on the event date and then viewed at least two distinct pages or clicked apply. Sessions that only record their landing page are excluded, which removes visitors who never answer the cookie banner, since it blocks the page, along with real single-page readers who did not apply. A date range attributes each session to its earliest captured event; this proposed time basis must be approved against counting any qualifying activity in the range. Use a rolling 28-day range for the provisional audience-growth outcome. This metric is not a cross-channel unique-person count."
      category: "Audience growth"
      type: "custom-value"
      time: "fct_web_sessions.session_started_ts"
      sql_expression: "countif(fct_web_sessions.is_engaged_job_seeker)"
      dimensions:
        - "dbt_prd.dim_web_sessions.*"
    - identifier: "applying_engaged_job_seeker_sessions"
      name: "Applying engaged job-seeker sessions"
      description: "Engaged job-seeker sessions that generated at least one outbound apply click."
      category: "Audience growth"
      type: "custom-value"
      time: "fct_web_sessions.session_started_ts"
      sql_expression: "countif(fct_web_sessions.is_engaged_job_seeker and fct_web_sessions.apply_click_count > 0)"
      dimensions:
        - "dbt_prd.dim_web_sessions.*"
    - identifier: "engaged_session_apply_rate"
      name: "Engaged session apply rate"
      description: "Percentage of captured engaged job-seeker sessions that generated at least one outbound apply click. This is the provisional quality guardrail."
      category: "Audience growth"
      type: "derived-ratio"
      numerator: "applying_engaged_job_seeker_sessions"
      denominator: "engaged_job_seeker_sessions"
      format: "percentage"
      dimensions:
        - "dbt_prd.dim_web_sessions.*"
