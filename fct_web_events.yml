module:
  identifier: "fct_web_events"
  schema: "dbt_prd"
  table: "fct_web_events"
  label: "Web Events"
  description: "One row per page view or outbound apply click captured on the production site. PostHog is consent-gated, so every count here is a floor on real traffic rather than total traffic. Events carry job and organization context when the visitor was on a job page. Page views begin 2025-12-22 and apply clicks begin 2026-04-21."
  dimensions:
    - column: "event_type"
      type: "categorical"
      label: "Web Event Type"
      description: "Provider-independent event type. An apply click fires on the outbound application link itself and is independent of the email-capture flow that follows it."
    - column: "page_path"
      type: "categorical"
      label: "Page Path"
      description: "Path of the page the event occurred on."
  metrics:
    - identifier: "page_views"
      name: "Page views"
      description: "Number of page views captured on the production site. Consent-gated, so this is a floor on real traffic. Group by job or organization dimensions to rank job pages by traffic."
      category: "Web engagement"
      type: "custom-value"
      time: "fct_web_events.event_ts"
      sql_expression: "countif(fct_web_events.event_type = 'page_view')"
      dimensions:
        - "event_type"
        - "page_path"
        - "dbt_prd.dim_jobs.*"
        - "dbt_prd.dim_organizations.*"
    - identifier: "apply_clicks"
      name: "Apply clicks"
      description: "Number of outbound apply-link clicks. Capture begins 2026-04-21, so any range starting earlier understates apply activity and should not be trended across that date."
      category: "Web engagement"
      type: "custom-value"
      time: "fct_web_events.event_ts"
      sql_expression: "countif(fct_web_events.event_type = 'apply_click')"
      dimensions:
        - "event_type"
        - "page_path"
        - "dbt_prd.dim_jobs.*"
        - "dbt_prd.dim_organizations.*"
    - identifier: "web_visitors"
      name: "Web visitors"
      description: "Unique visitors with a captured event. A visitor is an anonymous device identifier, not a person, because person profiles are disabled. Repeat visitors across devices or browsers are undercounted."
      category: "Web engagement"
      type: "count-distinct"
      time: "fct_web_events.event_ts"
      distinct_on: "fct_web_events.visitor_id"
      dimensions:
        - "event_type"
        - "page_path"
        - "dbt_prd.dim_jobs.*"
        - "dbt_prd.dim_organizations.*"
    - identifier: "job_popularity_score"
      name: "Job popularity score"
      description: "Weighted popularity signal, counting an apply click as twice a page view. Apply clicks and page views are closely correlated, so this behaves as traffic with a mild tilt toward apply intent rather than as two independent signals. It is deliberately approximate and is intended for selecting the most popular jobs over a recent window, not for precise comparison between them. A job accumulates score across the window, so a recently posted job scores low regardless of how well it is performing."
      category: "Web engagement"
      type: "custom-value"
      time: "fct_web_events.event_ts"
      sql_expression: "countif(fct_web_events.event_type = 'apply_click') * 2 + countif(fct_web_events.event_type = 'page_view')"
      dimensions:
        - "page_path"
        - "dbt_prd.dim_jobs.*"
        - "dbt_prd.dim_organizations.*"
    - identifier: "apply_click_rate"
      name: "Apply click rate"
      description: "Percentage of page views that produced an outbound apply click. This normalizes job popularity for unequal exposure. Apply-click capture begins 2026-04-21, so the rate reads as near zero for any range starting before that date even though page views were captured."
      category: "Web engagement"
      type: "derived-ratio"
      numerator: "apply_clicks"
      denominator: "page_views"
      format: "percentage"
      dimensions:
        - "page_path"
        - "dbt_prd.dim_jobs.*"
        - "dbt_prd.dim_organizations.*"
