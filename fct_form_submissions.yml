module:
  identifier: "fct_form_submissions"
  schema: "dbt_prd"
  table: "fct_form_submissions"
  label: "Form Submissions"
  description: "One row per legacy Webflow or current Netlify form submission, linked to known subscribers, jobs, and organizations when matching records exist."
  dimensions:
    - column: "source"
      type: "categorical"
      label: "Form Platform"
      description: "Platform that collected the form submission."
    - column: "form_name"
      type: "categorical"
      label: "Form Name"
      description: "Canonical form name, with deprecated Webflow variants consolidated under newsletter."
  metrics:
    - identifier: "form_submissions"
      name: "Form submissions"
      description: "Number of legacy Webflow or current Netlify form submissions."
      category: "Web engagement"
      type: "count"
      time: "fct_form_submissions.submitted_ts"
      slices:
        - name: "Job apply captures"
          identifier: "job_apply_captures"
          filter:
            column: "form_name"
            operator: "equals"
            expression: "job-apply-capture"
        - name: "Newsletter submissions"
          identifier: "newsletter_submissions"
          filter:
            column: "form_name"
            operator: "equals"
            expression: "newsletter"
        - name: "Offer reviews"
          identifier: "offer_reviews"
          filter:
            column: "form_name"
            operator: "equals"
            expression: "offer-review"
        - name: "Resume reviews"
          identifier: "resume_reviews"
          filter:
            column: "form_name"
            operator: "equals"
            expression: "resume-review"
      dimensions:
        - "source"
        - "form_name"
        - "dbt_prd.dim_email_subscribers.*"
        - "dbt_prd.dim_jobs.*"
        - "dbt_prd.dim_organizations.*"
    - identifier: "known_form_submitters"
      name: "Known form submitters"
      description: "Unique known email subscribers linked to at least one form submission. Submissions without a subscriber match are excluded."
      category: "Web engagement"
      type: "count-distinct"
      time: "fct_form_submissions.submitted_ts"
      distinct_on: "fct_form_submissions.subscriber_id"
      dimensions:
        - "source"
        - "form_name"
        - "dbt_prd.dim_email_subscribers.*"
        - "dbt_prd.dim_jobs.*"
        - "dbt_prd.dim_organizations.*"
