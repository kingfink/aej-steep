module:
  identifier: "fct_form_submissions"
  schema: "dbt_prd"
  table: "fct_form_submissions"
  label: "Form Submissions"
  description: "One row per legacy Webflow or current Netlify form submission, linked to known subscribers, jobs, organizations, and web sessions when matching records exist. Session context, and therefore channel, begins in 2026-07, is complete from 2026-08 onward, and only exists for visitors who consented to PostHog analytics."
  dimensions:
    - column: "source"
      type: "categorical"
      label: "Form Platform"
      description: "Platform that collected the form submission."
    - column: "form_name"
      type: "categorical"
      label: "Form Name"
      description: "Canonical form name, with deprecated Webflow variants consolidated under newsletter."
  metrics:
    - identifier: "form_submissions"
      name: "Form submissions"
      description: "Number of legacy Webflow or current Netlify form submissions. Grouping by channel only describes submissions with session context, which begins in 2026-07 and is complete from 2026-08; earlier submissions and submissions from visitors who declined PostHog consent have no channel, which is distinct from both direct and unknown. The internal channel is not direct traffic: it is a session window rollover mid-visit."
      category: "Web engagement"
      type: "count"
      time: "fct_form_submissions.submitted_ts"
      slices:
        - name: "Job apply captures"
          identifier: "job_apply_captures"
          filter:
            column: "form_name"
            operator: "equals"
            expression: "job-apply-capture"
        - name: "Newsletter submissions"
          identifier: "newsletter_submissions"
          filter:
            column: "form_name"
            operator: "equals"
            expression: "newsletter"
        - name: "Offer reviews"
          identifier: "offer_reviews"
          filter:
            column: "form_name"
            operator: "equals"
            expression: "offer-review"
        - name: "Resume reviews"
          identifier: "resume_reviews"
          filter:
            column: "form_name"
            operator: "equals"
            expression: "resume-review"
      dimensions:
        - "source"
        - "form_name"
        - "dbt_prd.dim_email_subscribers.*"
        - "dbt_prd.dim_jobs.*"
        - "dbt_prd.dim_organizations.*"
        - "dbt_prd.dim_web_sessions.*"
    - identifier: "known_form_submitters"
      name: "Known form submitters"
      description: "Unique known email subscribers linked to at least one form submission. Submissions without a subscriber match are excluded. Channel splits carry the same session-context gaps as form submissions."
      category: "Web engagement"
      type: "count-distinct"
      time: "fct_form_submissions.submitted_ts"
      distinct_on: "fct_form_submissions.subscriber_id"
      dimensions:
        - "source"
        - "form_name"
        - "dbt_prd.dim_email_subscribers.*"
        - "dbt_prd.dim_jobs.*"
        - "dbt_prd.dim_organizations.*"
        - "dbt_prd.dim_web_sessions.*"
    - identifier: "attributed_form_submissions"
      name: "Attributed form submissions"
      description: "Number of form submissions with session context, and therefore an acquisition channel. Session capture on Netlify forms begins in 2026-07 and is complete from 2026-08, and visitors who declined PostHog consent never carry session context."
      category: "Web engagement"
      type: "custom-value"
      time: "fct_form_submissions.submitted_ts"
      sql_expression: "countif(fct_form_submissions.session_id is not null)"
      dimensions:
        - "source"
        - "form_name"
        - "dbt_prd.dim_jobs.*"
        - "dbt_prd.dim_organizations.*"
    - identifier: "form_submission_attribution_coverage"
      name: "Form submission attribution coverage"
      description: "Percentage of form submissions with session context. Coverage is 0% before 2026-07 and complete from 2026-08 onward, because session capture on Netlify forms began in 2026-07. Any date range spanning that boundary produces a meaningless blend of the two regimes, so only read this for ranges entirely before or entirely from 2026-08. Within the covered period, a shortfall is consent-declined or unmatched sessions."
      category: "Web engagement"
      type: "derived-ratio"
      numerator: "attributed_form_submissions"
      denominator: "form_submissions"
      format: "percentage"
      dimensions:
        - "source"
        - "form_name"
        - "dbt_prd.dim_jobs.*"
        - "dbt_prd.dim_organizations.*"
