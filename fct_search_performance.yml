module:
  identifier: "fct_search_performance"
  schema: "dbt_prd"
  table: "fct_search_performance_daily"
  label: "Search Performance"
  description: "One row per date, page, query, country, search type, device, and Google Jobs search appearance, from the Search Console URL-level bulk export. Google withholds rare queries, and most impressions sit on rows with a null query, so any query drilldown describes a minority of volume and grouping by query silently drops most of it. URL-level totals are higher than the property-level totals in Site Search Performance, because several of the site's pages can appear for one search; never add or blend the two modules. History begins 2026-04-19, and Google publishes each date two to three days late."
  dimensions:
    - column: "query"
      type: "categorical"
      label: "Search Query"
      description: "Search query, null when Google withheld it because it was rare. Anonymized rows carry most impressions, so grouping by query describes a minority of volume."
    - column: "device"
      type: "categorical"
      label: "Search Device"
      description: "Device class the search came from."
    - column: "search_type"
      type: "categorical"
      label: "Search Type"
      description: "Search surface the impression was served on."
    - column: "search_appearance"
      type: "categorical"
      label: "Search Appearance"
      description: "Google Jobs experience the impression was served in, or null for a standard result."
  metrics:
    - identifier: "search_impressions"
      name: "Search impressions"
      description: "Number of times a site page appeared in Google Search results, from the URL-level export. Most impressions have a null query, so a query drilldown describes a minority of volume. Do not add to site search impressions."
      category: "Search"
      type: "sum"
      time: "fct_search_performance_daily.date_day"
      value: "fct_search_performance_daily.n_impressions"
      dimensions:
        - "query"
        - "device"
        - "search_type"
        - "search_appearance"
        - "dbt_prd.dim_pages.*"
        - "dbt_prd.dim_countries.*"
        - "dbt_prd.dim_jobs.*"
        - "dbt_prd.dim_organizations.*"
    - identifier: "search_clicks"
      name: "Search clicks"
      description: "Number of clicks from Google Search results through to a site page, from the URL-level export. Most impressions have a null query, so a query drilldown describes a minority of volume. Do not add to site search clicks."
      category: "Search"
      type: "sum"
      time: "fct_search_performance_daily.date_day"
      value: "fct_search_performance_daily.n_clicks"
      dimensions:
        - "query"
        - "device"
        - "search_type"
        - "search_appearance"
        - "dbt_prd.dim_pages.*"
        - "dbt_prd.dim_countries.*"
        - "dbt_prd.dim_jobs.*"
        - "dbt_prd.dim_organizations.*"
    - identifier: "search_ctr"
      name: "Search click-through rate"
      description: "Percentage of search impressions that produced a click, derived from summed clicks over summed impressions rather than an average of row-level rates."
      category: "Search"
      type: "derived-ratio"
      numerator: "search_clicks"
      denominator: "search_impressions"
      format: "percentage"
      dimensions:
        - "query"
        - "device"
        - "search_type"
        - "search_appearance"
        - "dbt_prd.dim_pages.*"
        - "dbt_prd.dim_countries.*"
        - "dbt_prd.dim_jobs.*"
        - "dbt_prd.dim_organizations.*"
    - identifier: "average_position"
      name: "Average search position"
      description: "Impression-weighted average result position, where 1 is the top result and lower is better. Derived as summed sum_position over summed impressions plus 1, because the export's positions are zero based, rather than as an average of row-level positions. Not comparable with site average search position, which uses each search's best-ranking result."
      category: "Search"
      type: "custom-value"
      time: "fct_search_performance_daily.date_day"
      sql_expression: "safe_divide(sum(fct_search_performance_daily.sum_position), sum(fct_search_performance_daily.n_impressions)) + 1"
      dimensions:
        - "query"
        - "device"
        - "search_type"
        - "search_appearance"
        - "dbt_prd.dim_pages.*"
        - "dbt_prd.dim_countries.*"
        - "dbt_prd.dim_jobs.*"
        - "dbt_prd.dim_organizations.*"
