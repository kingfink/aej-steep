module:
  identifier: "fct_search_performance_site"
  schema: "dbt_prd"
  table: "fct_search_performance_site_daily"
  label: "Site Search Performance"
  description: "One row per date, query, country, search type, and device, from the Search Console property-level bulk export. Property-level impressions count one appearance per search even when several of the site's pages rank for it, so these totals are lower than the URL-level totals in Search Performance; never add, union, or blend the two modules. Google withholds rare queries, and most impressions sit on rows with a null query, so any query drilldown describes a minority of volume. History begins 2026-04-19, and Google publishes each date two to three days late."
  dimensions:
    - column: "query"
      type: "categorical"
      label: "Site Search Query"
      description: "Search query, null when Google withheld it because it was rare. Anonymized rows carry most impressions, so grouping by query describes a minority of volume."
    - column: "device"
      type: "categorical"
      label: "Site Search Device"
      description: "Device class the search came from."
    - column: "search_type"
      type: "categorical"
      label: "Site Search Type"
      description: "Search surface the impression was served on."
  metrics:
    - identifier: "site_search_impressions"
      name: "Site search impressions"
      description: "Number of searches in which any site page appeared, from the property-level export. Lower than URL-level search impressions for the same dates; never add the two."
      category: "Search"
      type: "sum"
      time: "fct_search_performance_site_daily.date_day"
      value: "fct_search_performance_site_daily.n_impressions"
      dimensions:
        - "query"
        - "device"
        - "search_type"
        - "dbt_prd.dim_countries.*"
    - identifier: "site_search_clicks"
      name: "Site search clicks"
      description: "Number of clicks through to the site from Google Search results, from the property-level export. Not interchangeable with URL-level search clicks; never add the two."
      category: "Search"
      type: "sum"
      time: "fct_search_performance_site_daily.date_day"
      value: "fct_search_performance_site_daily.n_clicks"
      dimensions:
        - "query"
        - "device"
        - "search_type"
        - "dbt_prd.dim_countries.*"
    - identifier: "site_search_ctr"
      name: "Site search click-through rate"
      description: "Percentage of property-level search impressions that produced a click, derived from summed clicks over summed impressions. Not comparable with the URL-level search click-through rate."
      category: "Search"
      type: "derived-ratio"
      numerator: "site_search_clicks"
      denominator: "site_search_impressions"
      format: "percentage"
      dimensions:
        - "query"
        - "device"
        - "search_type"
        - "dbt_prd.dim_countries.*"
    - identifier: "site_average_position"
      name: "Site average search position"
      description: "Impression-weighted average position of the site's best-ranking result, where 1 is the top result. Derived as summed sum_top_position over summed impressions plus 1, because the export's positions are zero based. Not comparable with the URL-level average search position."
      category: "Search"
      type: "custom-value"
      time: "fct_search_performance_site_daily.date_day"
      sql_expression: "safe_divide(sum(fct_search_performance_site_daily.sum_top_position), sum(fct_search_performance_site_daily.n_impressions)) + 1"
      dimensions:
        - "query"
        - "device"
        - "search_type"
        - "dbt_prd.dim_countries.*"
