module:
  identifier: "dim_jobs"
  schema: "dbt_prd"
  table: "dim_jobs"
  label: "Jobs"
  description: "One row per organization and job slug for every job published on Analytics Engineering Jobs."
  dimensions:
    - column: "title"
      type: "categorical"
      label: "Job Title"
      description: "Published job title."
    - column: "location"
      type: "categorical"
      label: "Job Location"
      description: "Published job location."
    - column: "is_active"
      type: "categorical"
      label: "Is Active Job"
      description: "Whether the job is currently active on the site."
    - column: "is_featured"
      type: "categorical"
      label: "Is Featured Job"
      description: "Whether the job is featured on the site."
    - column: "date_added"
      type: "time"
      label: "Job Added Date"
      description: "Date the job was added to the site."
  joinPaths:
    - from:
        column: "job_id"
      to:
        table: "fct_form_submissions"
        column: "job_id"
      type: "one-to-many"
    - from:
        column: "job_id"
      to:
        table: "fct_web_events"
        column: "job_id"
      type: "one-to-many"
    - from:
        column: "job_id"
      to:
        table: "fct_email_events"
        column: "job_id"
      type: "one-to-many"
