module:
  identifier: "dim_jobs"
  schema: "dbt_prd"
  table: "dim_jobs"
  label: "Jobs"
  description: "One row per organization and job slug for every job published on Analytics Engineering Jobs."
  dimensions:
    - column: "organization_slug"
      type: "categorical"
      label: "Organization Slug"
      description: "Stable external and repository identifier for the organization that published the job."
    - column: "job_slug"
      type: "categorical"
      label: "Job Slug"
      description: "Stable external and repository identifier for the job within its organization."
    - column: "title"
      type: "categorical"
      label: "Job Title"
      description: "Published job title."
    - column: "location"
      type: "categorical"
      label: "Job Location"
      description: "Published job location."
    - column: "is_active"
      type: "categorical"
      label: "Is Active Job"
      description: "Whether the job is currently active on the site."
    - column: "is_featured"
      type: "categorical"
      label: "Is Featured Job"
      description: "Whether the job is featured on the site."
    - column: "date_added"
      type: "time"
      label: "Job Added Date"
      description: "Date the job was added to the site."
    - column: "level"
      type: "categorical"
      label: "Job Level"
      description: "The job's single level tag, such as Mid-Level or Senior. Empty when a job has no level tag or more than one, as a few legacy inactive jobs do."
    - column: "role_type"
      type: "categorical"
      label: "Job Role Type"
      description: "Individual Contributor or People Manager, from the job's single role type tag. Empty when a job has none or more than one."
    - column: "is_remote"
      type: "categorical"
      label: "Is Remote Job"
      description: "Whether the job has the Remote tag. False means other or unspecified, not onsite; the job location keeps any geographic restrictions."
  joinPaths:
    - from:
        column: "job_id"
      to:
        table: "fct_form_submissions"
        column: "job_id"
      type: "one-to-many"
    - from:
        column: "job_id"
      to:
        table: "fct_web_events"
        column: "job_id"
      type: "one-to-many"
    - from:
        column: "job_id"
      to:
        table: "fct_email_events"
        column: "job_id"
      type: "one-to-many"
    - from:
        column: "job_id"
      to:
        table: "fct_search_performance_daily"
        column: "job_id"
      type: "one-to-many"
    - from:
        column: "job_id"
      to:
        table: "fct_jobs_daily"
        column: "job_id"
      type: "one-to-many"
  entities:
    - identifier: "job"
      name: "Job"
      icon_name: "briefcase"
      primary_key: "job_id"
      properties:
        - column: "title"
          name: "Job title"
          type: "string"
        - column: "organization_slug"
          name: "Organization slug"
          type: "string"
        - column: "job_slug"
          name: "Job slug"
          type: "string"
        - column: "location"
          name: "Location"
          type: "string"
        - column: "salary"
          name: "Salary"
          type: "string"
        - column: "salary_annual_min"
          name: "Annual salary minimum (USD)"
          type: "number"
        - column: "salary_annual_max"
          name: "Annual salary maximum (USD)"
          type: "number"
        - column: "salary_annual_midpoint"
          name: "Annual salary midpoint (USD)"
          type: "number"
        - column: "level"
          name: "Level"
          type: "string"
        - column: "role_type"
          name: "Role type"
          type: "string"
        - column: "is_remote"
          name: "Is remote"
          type: "boolean"
        - column: "posting_url"
          name: "Posting URL"
          type: "string"
        - column: "is_active"
          name: "Is active"
          type: "boolean"
        - column: "is_featured"
          name: "Is featured"
          type: "boolean"
        - column: "date_added"
          name: "Added on"
          type: "time"
        - column: "date_removed"
          name: "Removed on"
          type: "time"
      metrics:
        - "listed_jobs"
        - "listed_jobs_with_salary"
        - "search_impressions"
        - "search_clicks"
        - "search_ctr"
        - "average_position"
        - "page_views"
        - "apply_clicks"
        - "web_visitors"
        - "attributed_page_views"
        - "page_view_attribution_coverage"
        - "job_popularity_score"
        - "apply_click_rate"
        - "form_submissions"
        - "known_form_submitters"
        - "attributed_form_submissions"
        - "form_submission_attribution_coverage"
        - "link_clicks"
        - "job_link_clicks"
        - "job_link_clickers"
        - "job_link_click_share"
