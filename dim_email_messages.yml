module:
  identifier: "dim_email_messages"
  schema: "dbt_prd"
  table: "dim_email_messages"
  label: "Email Messages"
  description: "One row per provider email message across Resend and SendGrid."
  dimensions:
    - column: "source"
      type: "categorical"
      label: "Email Provider"
      description: "Provider that sent the email message."
    - column: "subject"
      type: "categorical"
      label: "Email Subject"
      description: "Subject line supplied by the email provider."
  joinPaths:
    - from:
        column: "email_id"
      to:
        table: "fct_email_events"
        column: "email_id"
      type: "one-to-many"
    - from:
        column: "email_id"
      to:
        table: "fct_email_subscriber_messages"
        column: "email_id"
      type: "one-to-many"
  entities:
    - identifier: "email_message"
      name: "Email Message"
      icon_name: "mail"
      primary_key: "email_id"
      properties:
        - column: "subject"
          name: "Subject"
          type: "string"
        - column: "source"
          name: "Provider"
          type: "string"
        - column: "source_email_id"
          name: "Provider email ID"
          type: "string"
        - column: "sent_ts"
          name: "Sent at"
          type: "time"
      metrics:
        - "email_subscriber_messages"
        - "email_subscriber_messages_delivered"
        - "email_subscriber_messages_opened"
        - "email_subscriber_messages_clicked"
        - "email_delivery_rate"
        - "email_open_rate"
        - "email_click_rate"
        - "engaged_email_subscribers"
        - "link_clicks"
        - "job_link_clicks"
        - "job_link_clickers"
        - "job_link_click_share"
