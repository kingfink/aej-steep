module:
  identifier: "fct_email_events"
  schema: "dbt_prd"
  table: "fct_email_events"
  label: "Email Activity"
  description: "One row per provider email event and recipient across Resend and SendGrid."
  dimensions:
    - column: "event_type"
      type: "categorical"
      label: "Event Type"
      description: "Provider-independent event type such as delivered, opened, or clicked."
    - column: "is_engagement"
      type: "categorical"
      label: "Is Engagement"
      description: "Whether the event is an open or click."
    - column: "is_privacy_or_bot_like"
      type: "categorical"
      label: "Is Privacy or Bot Like"
      description: "Whether an open or click was classified as privacy-proxied or bot-like."
    - column: "link_type"
      type: "categorical"
      label: "Link Type"
      description: "Destination category of a clicked link. job_page is a job posting on the site, site is any other page on the site, unsubscribe is a provider-hosted unsubscribe page, and external is any other destination. Null for events that are not clicks."
    - column: "link_url"
      type: "categorical"
      label: "Link URL"
      description: "Clicked destination URL with the query string and fragment removed, so campaign parameters and per-contact unsubscribe tokens collapse to one value per destination. Null for events that are not clicks."
  metrics:
    - identifier: "email_events"
      name: "Email events"
      description: "Number of provider email events, including delivery and recipient activity."
      category: "Email"
      type: "count"
      time: "fct_email_events.event_ts"
      is_unlisted: true
      slices:
        - name: "Delivered"
          identifier: "delivered"
          filter:
            column: "event_type"
            operator: "equals"
            expression: "delivered"
        - name: "Opened"
          identifier: "opened"
          filter:
            column: "event_type"
            operator: "equals"
            expression: "opened"
        - name: "Clicked"
          identifier: "clicked"
          filter:
            column: "event_type"
            operator: "equals"
            expression: "clicked"
        - name: "Bounced"
          identifier: "bounced"
          filter:
            column: "event_type"
            operator: "equals"
            expression: "bounced"
      dimensions:
        - "event_type"
        - "is_engagement"
        - "is_privacy_or_bot_like"
        - "link_type"
        - "link_url"
        - "dbt_prd.dim_email_messages.*"
        - "dbt_prd.dim_jobs.*"
    - identifier: "engaged_email_subscribers"
      name: "Engaged email subscribers"
      description: "Unique known subscribers with an open or click. Privacy-proxied and bot-like activity remains included and can be filtered using the available dimension."
      category: "Email"
      type: "count-distinct"
      time: "fct_email_events.event_ts"
      distinct_on: "fct_email_events.subscriber_id"
      filters:
        - column: "is_engagement"
          operator: "equals"
          expression: "true"
      cohort:
        time_dimension: "dbt_prd.dim_email_subscribers.min_subscribed_ts"
        label: "First subscribed at"
        calculate_retention: true
        time_grains:
          - "weekly"
          - "monthly"
        delta_time_calculation_type: "calendar-periods"
      dimensions:
        - "event_type"
        - "is_privacy_or_bot_like"
        - "dbt_prd.dim_email_messages.*"
    - identifier: "link_clicks"
      name: "Newsletter link clicks"
      description: "Number of click events on any tracked link. Each click carries exactly one destination, so this is also the count of clicked links. Privacy-proxied and bot-like activity remains included and can be filtered using the available dimension."
      category: "Email"
      type: "custom-value"
      time: "fct_email_events.event_ts"
      sql_expression: "countif(fct_email_events.event_type = 'clicked')"
      dimensions:
        - "link_type"
        - "link_url"
        - "is_privacy_or_bot_like"
        - "dbt_prd.dim_email_messages.*"
        - "dbt_prd.dim_email_campaigns.*"
        - "dbt_prd.dim_jobs.*"
    - identifier: "job_link_clicks"
      name: "Job link clicks"
      description: "Number of click events on a link pointing at a job posting. Group by job dimensions to rank jobs by newsletter engagement. Legacy SendGrid-era job links used a flat path and are not resolved to a job, so they count here only if classified as job_page upstream."
      category: "Email"
      type: "custom-value"
      time: "fct_email_events.event_ts"
      sql_expression: "countif(fct_email_events.event_type = 'clicked' and fct_email_events.link_type = 'job_page')"
      dimensions:
        - "link_url"
        - "is_privacy_or_bot_like"
        - "dbt_prd.dim_email_messages.*"
        - "dbt_prd.dim_email_campaigns.*"
        - "dbt_prd.dim_jobs.*"
    - identifier: "job_link_clickers"
      name: "Job link clickers"
      description: "Unique known subscribers who clicked a link pointing at a job posting. A job clicked once each by many subscribers ranks above a job clicked repeatedly by one, which makes this the more robust popularity signal of the two."
      category: "Email"
      type: "count-distinct"
      time: "fct_email_events.event_ts"
      distinct_on: "fct_email_events.subscriber_id"
      filters:
        - column: "event_type"
          operator: "equals"
          expression: "clicked"
        - column: "link_type"
          operator: "equals"
          expression: "job_page"
      dimensions:
        - "link_url"
        - "is_privacy_or_bot_like"
        - "dbt_prd.dim_email_messages.*"
        - "dbt_prd.dim_email_campaigns.*"
        - "dbt_prd.dim_jobs.*"
    - identifier: "job_link_click_share"
      name: "Job link click share"
      description: "Percentage of all newsletter link clicks that went to a job posting. Grouped by job, this ranks jobs by the share of newsletter attention they captured, which is comparable across issues of unequal size."
      category: "Email"
      type: "derived-ratio"
      numerator: "job_link_clicks"
      denominator: "link_clicks"
      format: "percentage"
      dimensions:
        - "is_privacy_or_bot_like"
        - "dbt_prd.dim_email_messages.*"
        - "dbt_prd.dim_email_campaigns.*"
        - "dbt_prd.dim_jobs.*"
