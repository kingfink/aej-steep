module:
  identifier: "dim_email_campaigns"
  schema: "dbt_prd"
  table: "dim_email_campaigns"
  label: "Email Campaigns"
  description: "One row per email campaign, where a campaign is the batch of messages sharing a provider, subject, and send date. A campaign is the entity that corresponds to a newsletter issue, since a message is a single recipient send. Transactional and test sends are campaigns too."
  dimensions:
    - column: "campaign_name"
      type: "categorical"
      label: "Campaign Name"
      description: "Campaign name taken from the utm_campaign parameter on the campaign's tracked links. Null for campaigns whose links carry no campaign parameter and for campaigns that were never clicked."
    - column: "subject"
      type: "categorical"
      label: "Campaign Subject"
      description: "Campaign subject line when supplied by the provider. Always null for SendGrid, which did not record subjects."
    - column: "is_test"
      type: "categorical"
      label: "Is Test Campaign"
      description: "Whether the campaign is a test send, identified by a bracketed TEST subject prefix. Filter these out before reporting on newsletter performance."
    - column: "campaign_date"
      type: "time"
      label: "Campaign Date"
      description: "UTC date the campaign was sent, anchored to the earliest sent event across the campaign's messages."
  joinPaths:
    - from:
        column: "email_campaign_id"
      to:
        table: "dim_email_messages"
        column: "email_campaign_id"
      type: "one-to-many"
  entities:
    - identifier: "email_campaign"
      name: "Email Campaign"
      icon_name: "mail"
      primary_key: "email_campaign_id"
      properties:
        - column: "campaign_name"
          name: "Campaign name"
          type: "string"
        - column: "subject"
          name: "Subject"
          type: "string"
        - column: "source"
          name: "Provider"
          type: "string"
        - column: "campaign_date"
          name: "Campaign date"
          type: "time"
        - column: "first_sent_ts"
          name: "First sent at"
          type: "time"
        - column: "message_count"
          name: "Messages"
          type: "number"
        - column: "is_test"
          name: "Is test"
          type: "boolean"
      metrics:
        - "link_clicks"
        - "job_link_clicks"
        - "job_link_clickers"
        - "job_link_click_share"
