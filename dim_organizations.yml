module:
  identifier: "dim_organizations"
  schema: "dbt_prd"
  table: "dim_organizations"
  label: "Organizations"
  description: "One row per organization published on Analytics Engineering Jobs."
  dimensions:
    - column: "name"
      type: "categorical"
      label: "Organization"
      description: "Published organization name."
    - column: "headcount"
      type: "categorical"
      label: "Organization Headcount"
      description: "Published or inferred organization headcount range."
    - column: "location"
      type: "categorical"
      label: "Organization Location"
      description: "Published or inferred organization location."
    - column: "is_active"
      type: "categorical"
      label: "Is Active Organization"
      description: "Whether the organization is currently active on the site."
    - column: "is_featured"
      type: "categorical"
      label: "Is Featured Organization"
      description: "Whether the organization is featured on the site."
  joinPaths:
    - from:
        column: "organization_id"
      to:
        table: "fct_form_submissions"
        column: "organization_id"
      type: "one-to-many"
