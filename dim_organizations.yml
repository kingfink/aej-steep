module:
  identifier: "dim_organizations"
  schema: "dbt_prd"
  table: "dim_organizations"
  label: "Organizations"
  description: "One row per organization published on Analytics Engineering Jobs."
  dimensions:
    - column: "organization_slug"
      type: "categorical"
      label: "Organization Slug"
      description: "Stable external and repository identifier for the organization."
    - column: "name"
      type: "categorical"
      label: "Organization"
      description: "Published organization name."
    - column: "headcount"
      type: "categorical"
      label: "Organization Headcount"
      description: "Published or inferred organization headcount range."
    - column: "location"
      type: "categorical"
      label: "Organization Location"
      description: "Published or inferred organization location."
    - column: "is_active"
      type: "categorical"
      label: "Is Active Organization"
      description: "Whether the organization is currently active on the site."
    - column: "is_featured"
      type: "categorical"
      label: "Is Featured Organization"
      description: "Whether the organization is featured on the site."
  joinPaths:
    - from:
        column: "organization_id"
      to:
        table: "fct_form_submissions"
        column: "organization_id"
      type: "one-to-many"
    - from:
        column: "organization_id"
      to:
        table: "fct_web_events"
        column: "organization_id"
      type: "one-to-many"
    - from:
        column: "organization_id"
      to:
        table: "fct_search_performance_daily"
        column: "organization_id"
      type: "one-to-many"
  entities:
    - identifier: "organization"
      name: "Organization"
      icon_name: "building"
      primary_key: "organization_id"
      properties:
        - column: "name"
          name: "Organization"
          type: "string"
        - column: "organization_slug"
          name: "Organization slug"
          type: "string"
        - column: "headcount"
          name: "Headcount"
          type: "string"
        - column: "location"
          name: "Location"
          type: "string"
        - column: "organization_url"
          name: "Website"
          type: "string"
        - column: "is_active"
          name: "Is active"
          type: "boolean"
        - column: "is_featured"
          name: "Is featured"
          type: "boolean"
      metrics:
        - "search_impressions"
        - "search_clicks"
        - "search_ctr"
        - "average_position"
        - "page_views"
        - "apply_clicks"
        - "web_visitors"
        - "attributed_page_views"
        - "page_view_attribution_coverage"
        - "job_popularity_score"
        - "apply_click_rate"
        - "form_submissions"
        - "known_form_submitters"
        - "attributed_form_submissions"
        - "form_submission_attribution_coverage"
